<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}InnovaFile System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    body{background:#f8f7fc!important;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
    .btn-primary{background:#7e22ce;border-color:#7e22ce}.btn-primary:hover{background:#6b21a8;border-color:#6b21a8}
    .login-background{min-height:100vh;background:radial-gradient(circle at top right,#ede9fe 0,transparent 35%),#f8f7fc}
    .logo-circle{width:62px;height:62px;margin:auto;border-radius:18px;display:grid;place-items:center;background:#7e22ce;color:white;font-size:29px}
  </style>
</head>
<body>{% block content %}{% endblock %}</body>
</html>
